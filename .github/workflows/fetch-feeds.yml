name: Fetch RSS Feeds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: |
          set -x
          python3 scripts/fetch_feeds.py || true
          cat public/feed.json

      - name: Commit feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feed.json
          git diff --staged --quiet || git commit -m "chore: feed update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
